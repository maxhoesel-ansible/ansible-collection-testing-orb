description: >
  Simple workflow example
# Provide a use-case based example for using this orb.
# Everything in the `usage` section will be displayed in the orb registry.
# Comments are not retained.
usage:
  version: 2.1
  orbs:
    collection-test: maxhoesel-ansible/ansible-collection-testing@0.5.0
  filters: &semver-tagged
    tags:
      only: /^v(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)(?:-((?:0|[1-9]\d*|\d*[a-zA-Z-][0-9a-zA-Z-]*)(?:\.(?:0|[1-9]\d*|\d*[a-zA-Z-][0-9a-zA-Z-]*))*))?(?:\+([0-9a-zA-Z-]+(?:\.[0-9a-zA-Z-]+)*))?$/
    branches:
      ignore: /.*/
  workflows:
    ci:
      jobs:
        - collection-test/pre_commit_lint:
            name: Lint with Pre-Commit
        - collection-test/antsibull_docs:
            name: Generate Docs
            collection-name: maxhoesel.smallstep
        - collection-test/pytest:
            name: Run Pytest
            parallelism: 6
            pytest-args: "--custom-arg abc"
        - collection-testing/publish_github:
            name: Publish Release to GitHub
            context: collection-publishing
            filters: *semver-tagged
        - collection-testing/publish_galaxy:
            name: Publish to Galaxy
            context: collection-publishing
            filters: *semver-tagged
