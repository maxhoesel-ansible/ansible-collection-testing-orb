description: >
  Run Pytest to execute collection tests, with support for parallelism and timing-based splitting
parameters:
  pytest_args:
    description: Additional parameters to pass to pytest
    type: string
    default: ""
  ubuntu_image:
    description: Machine executor ubuntu image version to use
    type: string
    default: 2604:2026.07.1
  resource_class:
    description: Machine executor resource class
    type: string
    default: large
  parallelism:
    description: Number of jobs to run in parallel
    type: integer
    default: 1
executor:
  name: machine
  image: ubuntu-<<parameters.ubuntu_image>>
  resource_class: <<parameters.resource_class>>
parallelism: <<parameters.parallelism>>
steps:
  - checkout
  - run:
      name: Install uv
      command: |
        sudo apt update && sudo apt install -y snapd
        sudo snap install --classic astral-uv
  - python/install-packages:
      pkg-manager: uv
      args: --locked
  - run:
      name: Run Pytest
      command: |
        mkdir results
        uv run --locked -- pytest --collect-only -q | head -n -2 | cut -d ':' -f 2- | sed 's/: *//' | circleci tests split --split-by=timings > split-tests
        echo "Running the following tests:"
        cat split-tests
        uv run --locked -- pytest -k "$(cat split-tests | awk -v d=' or ' '{s=(NR==1?s:s d)$0}END{print s}')" --junitxml=results/junit.xml <<parameters.pytest_args>>
  - store_test_results:
      path: results
