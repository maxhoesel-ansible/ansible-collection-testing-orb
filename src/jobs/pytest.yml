description: >
  Run Pytest to execute collection tests, with support for parallelism and timing-based splitting
parameters:
  pytest-args:
    description: Additional parameters to pass to pytest
    type: string
    default: ""
steps:
  - checkout
  - python/install-packages:
      pkg-manager: uv
  - run:
      name: Run Pytest
      command: |
        mkdir results
        uv run -- pytest --collect-only -q | head -n -2 | cut -d ':' -f 2- | sed 's/: *//' | circleci tests split --split-by=timings > split-tests
        echo "Running the following tests:"
        cat split-tests
        uv run -- pytest -k "$(cat split-tests | awk -v d=' or ' '{s=(NR==1?s:s d)$0}END{print s}')" --junitxml=results/junit.xml <<parameters.pytest-args>>
  - store_test_results:
      path: results
