description: >
  Run Pytest to execute collection tests, with support for parallelism and timing-based splitting
parameters:
  pytest-args:
    description: Additional parameters to pass to pytest
    type: string
    default: ""
  ubuntu_image:
    description: Machine executor ubuntu image version to use
    type: string
    default: 2604:2026.07.1
  resource_class:
    description: Machine executor resource class
    type: string
    default: large
executor:
  name: machine
  image: ubuntu-<<parameters.ubuntu_build>>
  resource_class: <<parameters.resource_class>>
steps:
  - checkout
  - run:
      name: Install uv
      command: |
        snap install uv
  - python/install-packages:
      pkg-manager: uv
  - run:
      name: Run Pytest
      command: |
        mkdir results
        uv run -- pytest --collect-only -q | head -n -2 | cut -d ':' -f 2- | sed 's/: *//' | circleci tests split --split-by=timings > split-tests
        echo "Running the following tests:"
        cat split-tests
        uv run -- pytest -k "$(cat split-tests | awk -v d=' or ' '{s=(NR==1?s:s d)$0}END{print s}')" --junitxml=results/junit.xml <<parameters.pytest-args>>
  - store_test_results:
      path: results
