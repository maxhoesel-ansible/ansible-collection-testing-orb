description: Build and optionally install a collection tarball
parameters:
  path:
    type: string
    default: "."
    description: Store the tarball in this directory (relative from project root)
  install:
    type: boolean
    default: false
    description: Whether to install the collection locally
  ansible_galaxy_executable:
    type: string
    default: ansible-galaxy
    description: How to execute ansible-galaxy
steps:
  - run:
      command: <<parameters.ansible_galaxy_executable>> collection build --output-path <<parameters.path>> --force
      name: Build Collection
  - run:
      command: <<parameters.ansible_galaxy_executable>> collection install <<parameters.path>>/*.tar.gz --force
      name: Install Collection
