version: 2.1
setup: true
orbs:
  orb-tools: circleci/orb-tools@12.4.0
  shellcheck: circleci/shellcheck@3.4.0

filters: &filters
  tags:
    only: /.*/

workflows:
  lint-pack:
    jobs:
      - orb-tools/lint:
          filters: *filters
      - orb-tools/pack:
          filters: *filters
      - orb-tools/review:
          filters: *filters
          # RC009: Command length - triggers on scripts that can't be easily inlined due to parameter usage
          # RC010: snake_casing for components - circleci doesn't even do this for their own components and its ugly
          exclude: "RC009,RC010"
      - shellcheck/check:
          filters: *filters
      # Triggers the next workflow in the Orb Development Kit.
      - orb-tools/continue:
          orb_name: collection-testing
          pipeline_number: << pipeline.number >>
          vcs_type: << pipeline.project.type >>
          requires:
            [orb-tools/lint, orb-tools/review, orb-tools/pack, shellcheck/check]
          filters: *filters
